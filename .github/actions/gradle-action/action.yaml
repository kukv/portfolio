name: Gradle action
description: Gradle action

inputs:
  command:
    description: Run command
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'corretto'
        java-version: 25

    - shell: bash
      run: chmod +x gradlew

    - shell: bash
      # 入力は env 経由で渡す(${{ }} の直接埋め込みは注入の余地がある)
      env:
        GRADLE_COMMAND: ${{ inputs.command }}
      run: ./gradlew "$GRADLE_COMMAND"
