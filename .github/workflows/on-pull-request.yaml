name: on-pull-request

on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle Cache
        # $/ 記法は actionlint(v1.7.12)が構文エラーにするため ./ のままにする
        uses: ./.github/actions/gradle-cache # zizmor: ignore[self-repository]

      - name: Check with Gradle
        uses: ./.github/actions/gradle-action # zizmor: ignore[self-repository]
        with:
          command: check
