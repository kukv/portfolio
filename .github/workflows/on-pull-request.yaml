name: on-pull-request

on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Gradle Cache
        # $/ 記法は actionlint(v1.7.12)が構文エラーにするため ./ のままにする
        uses: ./.github/actions/gradle-cache # zizmor: ignore[self-repository]

      - name: Check with Gradle
        uses: ./.github/actions/gradle-action # zizmor: ignore[self-repository]
        with:
          command: check
