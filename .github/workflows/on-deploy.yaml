name: on-deploy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle Cache
        # $/ 記法は actionlint(v1.7.12)が構文エラーにするため ./ のままにする
        uses: ./.github/actions/gradle-cache # zizmor: ignore[self-repository]

      - name: Check with Gradle
        uses: ./.github/actions/gradle-action # zizmor: ignore[self-repository]
        with:
          command: wasmJsBrowserDistribution

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dist/wasmJs/productionExecutable

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  generate-release-note:
    needs: deploy

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a release note
        # タグ名・リポジトリ名は env 経由で渡す(${{ }} の直接埋め込みは注入の余地がある)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" --generate-notes --latest --verify-tag --repo "$TARGET_REPO"
